name: Keep Render service alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      RENDER_URL: https://varta-ixap.onrender.com
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 30 "$RENDER_URL/health"
